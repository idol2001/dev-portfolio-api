# dev
system:
  # 系统名称
  app-name: go-gin-rest-api
  # 系统环境
  run-mode: se
  # 数据库类型: sqlite, mysql
  db-type: sqlite
  # url前缀
  url-path-prefix: api
  # 程序监听端口
  port: 8080
  # API地址
  base-api: http://127.0.0.1:8080
  # 开启全局事务管理器
  transaction: true
  # 是否初始化数据(没有初始数据时使用, 已发布正式版谨慎使用)
  init-data: true
logs:
  # 日志等级(-4:Debug, 0:Info,4:Warn, 8:Error, 参照slog.level源码)
  level: -4
  # 日志路径
  path: logs
  # 文件最大大小, M
  max-size: 50
  # 备份数
  max-backups: 100
  # 存放时间, 天
  max-age: 30
  # 是否压缩
  compress: false

# SQLite 配置 (当 db-type: sqlite 时生效)
sqlite:
  file: "data/portfolio.db"    # SQLite 数据库文件路径

# MySQL 配置 (当 db-type: mysql 时生效)
mysql:
  # 用户名（优先读取环境变量 MYSQL_USERNAME）
  username: ""
  # 密码（优先读取环境变量 MYSQL_PASSWORD）
  password: ""
  # 数据库名（优先读取环境变量 MYSQL_DATABASE）
  database: ""
  # 主机地址（优先读取环境变量 MYSQL_HOST）
  host: ""
  # 端口（优先读取环境变量 MYSQL_PORT）
  port: 3306
  # 连接字符串查询参数
  query: charset=utf8mb4&parseTime=True&loc=Local&timeout=10000ms
# casbin配置
casbin:
  # 模型配置文件, 默认以conf目录为根目录
  model-path: "rbac_model.conf"
# jwt配置
jwt:
  # token过期时间, 小时
  timeout: 2
  # token更新时间, 小时
  max-refresh: 2
# casdoor配置
casdoor:
  # 端点（优先读取环境变量 CASDOOR_ENDPOINT）
  endpoint: "http://127.0.0.1:8000"
  # 客户端ID（优先读取环境变量 CASDOOR_CLIENT_ID）
  client-id: ""
  # 客户端密钥（优先读取环境变量 CASDOOR_CLIENT_SECRET）
  client-secret: ""
  certificate-path: "casdoor-se.pem"
  organization: "built-in"
  application: "app-built-in"
  frontend-url: "http://localhost:3000"

# 阿里云 OSS 配置（未启用时使用本地存储）
# 所有字段优先读取环境变量（见 .env.example）
aliyun-oss:
  enable: false                     # 是否启用 OSS（ALIYUNOSS_ENABLE）
  endpoint: "oss-cn-hangzhou.aliyuncs.com"   # OSS Endpoint（ALIYUNOSS_ENDPOINT）
  access-key-id: ""                 # 阿里云 AccessKey ID（ALIYUNOSS_ACCESS_KEY_ID）
  access-key-secret: ""             # 阿里云 AccessKey Secret（ALIYUNOSS_ACCESS_KEY_SECRET）
  bucket-name: ""                   # Bucket 名称（ALIYUNOSS_BUCKET_NAME）
  bucket-domain: ""                 # 自定义域名，留空则使用 OSS 默认域名（ALIYUNOSS_BUCKET_DOMAIN）
  dir-prefix: "dev-portfolio"       # 文件目录前缀（ALIYUNOSS_DIR_PREFIX）
